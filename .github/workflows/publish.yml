name: Publish reviewed content
on:
  repository_dispatch:
    types: [publish-site]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://www.lzzhu.net
    env:
      RELEASE_ID: ${{ github.event.client_payload.releaseId }}
      ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
      ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.sourceCommit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:prepare
      - if: env.ROLLBACK != 'true'
        run: pnpm build:assets && pnpm --filter @lzzhu/site build
      - run: pnpm audit:output
      - run: pnpm exec tsx scripts/release.ts package
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist
      - run: pnpm exec tsx scripts/release.ts deploy
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
      - if: always()
        run: pnpm release:report
        env:
          DEPLOYMENT_RESULT: ${{ steps.deployment.outcome }}
