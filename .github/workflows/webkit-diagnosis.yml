name: WebKit diagnosis
# Temporary, removed before merging: runs only the Linux WebKit failures, with traces.
on:
  push:
    branches: ['codex/presentation-refinement']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test -c tests/diagnostics/diagnosis.config.ts -g "timing|AUD-03|Sidebar fills|Page outline|published pages pass"
        timeout-minutes: 15
        env:
          CI: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: webkit-diagnosis
          path: test-results/
