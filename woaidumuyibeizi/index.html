    <form id="request-form">
        <label for="request">请输入你的具体要求：</label><br>
        <input type="text" id="request" required><br>
        <button type="submit">提交申请</button>
    </form>
    <div class="history">
        <h3>申请记录：</h3>
        <ul id="history-list"></ul>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let remainingCount = 2;  // 剩余次数
        const countDisplay = document.getElementById("remaining-count");
        const requestForm = document.getElementById("request-form");
        const requestInput = document.getElementById("request");
        const historyList = document.getElementById("history-list");
        const submitButton = requestForm.querySelector("button");

        requestForm.addEventListener("submit", function (event) {
            event.preventDefault();
            if (remainingCount > 0) {
                const requestText = requestInput.value.trim();
                if (requestText) {
                    // 追加记录
                    const newRecord = document.createElement("li");
                    newRecord.textContent = requestText;
                    historyList.appendChild(newRecord);

                    // 添加淡入效果
                    newRecord.style.opacity = "0";
                    setTimeout(() => {
                        newRecord.style.opacity = "1";
                        newRecord.style.transition = "opacity 0.5s ease-in-out";
                    }, 50);

                    // 更新次数
                    remainingCount -= 1;
                    countDisplay.textContent = remainingCount;

                    // 清空输入框
                    requestInput.value = "";

                    // 禁用按钮
                    if (remainingCount === 0) {
                        submitButton.disabled = true;
                    }
                }
            }
        });
    });
</script>
